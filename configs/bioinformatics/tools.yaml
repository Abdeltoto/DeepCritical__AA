# @package _global_

# Tool configuration extracted from hardcoded values
# Configuration for bioinformatics tools and their parameters

# BioContainers-backed BioinfoMCP catalog for GitHub issue #130.
# These entries define the public issue tool names and intended server/method
# routing without requiring the heavy server implementations to land in one PR.
bioinformatics_mcp_servers:
  issue_number: 130
  enabled_tools:
    - bamCoverage
    - faToTwoBit
    - gatk_ApplyBQSR
    - gatk_BaseRecalibrator
    - gatk_HaplotypeCaller
    - gatk_SelectVariants
    - gunzip
    - mafft
    - multiqc
    - plotCorrelation
    - quast
    - trimmomatic
  tools:
    bamCoverage:
      issue_number: 131
      server: deeptools
      tool: deeptools_bam_coverage
      category: coverage_analysis
      implementation_phase: deeptools_reconciliation
      container_hint: biocontainers/deeptools
      aliases: [bam_coverage, deeptools_bam_coverage]
    faToTwoBit:
      issue_number: 132
      server: fatotwobit
      tool: fatotwobit_convert
      category: reference_conversion
      implementation_phase: fatotwobit_server
      container_hint: biocontainers/ucsc-fatotwobit
      aliases: [fatotwobit, fa_to_twobit]
    gatk_ApplyBQSR:
      issue_number: 133
      server: gatk
      tool: gatk_apply_bqsr
      category: variant_calling
      implementation_phase: gatk_suite
      container_hint: biocontainers/gatk4
      aliases: [ApplyBQSR, gatk_applybqsr]
    gatk_BaseRecalibrator:
      issue_number: 134
      server: gatk
      tool: gatk_base_recalibrator
      category: variant_calling
      implementation_phase: gatk_suite
      container_hint: biocontainers/gatk4
      aliases: [BaseRecalibrator, gatk_baserecalibrator]
    gatk_HaplotypeCaller:
      issue_number: 135
      server: haplotypecaller
      tool: call_variants
      category: variant_calling
      implementation_phase: haplotypecaller_reconciliation
      container_hint: biocontainers/gatk4
      aliases: [HaplotypeCaller, gatk_haplotypecaller]
    gatk_SelectVariants:
      issue_number: 136
      server: gatk
      tool: gatk_select_variants
      category: variant_filtering
      implementation_phase: gatk_suite
      container_hint: biocontainers/gatk4
      aliases: [SelectVariants, gatk_selectvariants]
    gunzip:
      issue_number: 137
      server: gunzip
      tool: gunzip_decompress
      category: compression
      implementation_phase: gunzip_reconciliation
      container_hint: biocontainers/gnu-coreutils
      aliases: [gzip_decompress, decompress_gzip]
    mafft:
      issue_number: 138
      server: mafft
      tool: mafft_align
      category: multiple_sequence_alignment
      implementation_phase: mafft_reconciliation
      container_hint: biocontainers/mafft
      aliases: [mafft_align]
    multiqc:
      issue_number: 139
      server: multiqc
      tool: multiqc_run
      category: quality_control
      implementation_phase: multiqc_reconciliation
      container_hint: biocontainers/multiqc
      aliases: [multiqc_run]
    plotCorrelation:
      issue_number: 140
      server: deeptools
      tool: deeptools_plot_correlation
      category: quality_control
      implementation_phase: deeptools_completion
      container_hint: biocontainers/deeptools
      aliases: [plot_correlation, deeptools_plot_correlation]
    quast:
      issue_number: 141
      server: quast
      tool: quast_assess
      category: assembly_quality
      implementation_phase: quast_server
      container_hint: biocontainers/quast
      aliases: [quast_assess]
    trimmomatic:
      issue_number: 142
      server: trimmomatic
      tool: trimmomatic_pe
      category: read_preprocessing
      implementation_phase: trimmomatic_server
      container_hint: biocontainers/trimmomatic
      aliases: [trimmomatic_pe, trimmomatic_se]

tools:
  bioinformatics_fusion:
    name: "bioinformatics_fusion"
    description: "Fuse data from multiple bioinformatics sources (GO, PubMed, GEO, etc.)"
    inputs:
      fusion_type: "TEXT"
      source_databases: "TEXT"
      filters: "TEXT"
      quality_threshold: "FLOAT"
    outputs:
      fused_dataset: "JSON"
      quality_metrics: "JSON"
      success: "BOOLEAN"
    defaults:
      fusion_type: "MultiSource"
      source_databases: "GO,PubMed"
      quality_threshold: ${bioinformatics.quality.default_threshold}

  bioinformatics_reasoning:
    name: "bioinformatics_reasoning"
    description: "Perform integrative reasoning on bioinformatics data"
    inputs:
      question: "TEXT"
      task_type: "TEXT"
      dataset: "JSON"
      difficulty_level: "TEXT"
    outputs:
      answer: "TEXT"
      confidence: "FLOAT"
      supporting_evidence: "JSON"
      reasoning_chain: "JSON"
    defaults:
      task_type: "general_reasoning"
      difficulty_level: ${bioinformatics.reasoning.default_difficulty_level}

  bioinformatics_workflow:
    name: "bioinformatics_workflow"
    description: "Run complete bioinformatics workflow with data fusion and reasoning"
    inputs:
      question: "TEXT"
      config: "JSON"
    outputs:
      final_answer: "TEXT"
      processing_steps: "JSON"
      quality_metrics: "JSON"
      reasoning_result: "JSON"
    defaults:
      processing_steps: ["Parse", "Fuse", "Assess", "Create", "Reason", "Synthesize"]

  go_annotation_processor:
    name: "go_annotation_processor"
    description: "Process GO annotations with PubMed paper context for reasoning tasks"
    inputs:
      annotations: "JSON"
      papers: "JSON"
      evidence_codes: "TEXT"
    outputs:
      processed_annotations: "JSON"
      quality_score: "FLOAT"
      annotation_count: "INTEGER"
    defaults:
      evidence_codes: "IDA,EXP"
      quality_score_ida: 0.9
      quality_score_other: 0.7

  pubmed_retriever:
    name: "pubmed_retriever"
    description: "Retrieve PubMed papers based on query with full text for open access papers"
    inputs:
      query: "TEXT"
      max_results: "INTEGER"
      year_min: "INTEGER"
    outputs:
      papers: "JSON"
      total_found: "INTEGER"
      open_access_count: "INTEGER"
    defaults:
      max_results: ${bioinformatics.pubmed.default_max_results}
      year_min: ${bioinformatics.pubmed.default_year_min}

# Deferred tools configuration
deferred_tools:
  go_annotation_processor:
    evidence_codes: ${bioinformatics.evidence_codes.high_quality}
    quality_threshold: ${bioinformatics.quality.default_threshold}

  pubmed_paper_retriever:
    max_results: ${bioinformatics.pubmed.default_max_results}
    year_min: ${bioinformatics.pubmed.default_year_min}
    include_full_text: ${bioinformatics.pubmed.include_full_text}

  geo_data_retriever:
    include_expression: ${bioinformatics.geo.include_expression}
    max_series: ${bioinformatics.geo.default_max_series}

  drug_target_mapper:
    include_targets: ${bioinformatics.drugbank.include_targets}
    include_mechanisms: ${bioinformatics.drugbank.include_mechanisms}

  protein_structure_retriever:
    include_interactions: ${bioinformatics.pdb.include_interactions}
    resolution_max: ${bioinformatics.pdb.resolution_max}

  data_fusion_engine:
    quality_threshold: ${bioinformatics.fusion.default_quality_threshold}
    cross_reference_enabled: ${bioinformatics.fusion.cross_reference_enabled}

  reasoning_engine:
    confidence_threshold: ${bioinformatics.reasoning.default_confidence_threshold}
    max_reasoning_steps: ${bioinformatics.reasoning.max_reasoning_steps}
    integrative_approach: ${bioinformatics.reasoning.integrative_approach}

# Tool dependencies configuration
tool_dependencies:
  config: {}
  model_name: ${bioinformatics.model.default}
  quality_threshold: ${bioinformatics.quality.default_threshold}
