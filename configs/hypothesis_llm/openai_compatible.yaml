# Example LLM hypothesis generation parameters.
# Merge keys under your orchestration ``parameters`` or pass via CLI flags.
#
# Local OpenAI-compatible servers (vLLM, llama.cpp server, TGI): set ``base_url``
# (e.g. ``http://localhost:8000/v1``) and ``model_name`` to the served model id.

model_name: gpt-4o-mini
base_url: https://api.openai.com/v1
temperature: 0.4
max_hypotheses: 6
enable_critic_pass: true
propose_retries: 1
enable_evidence_synthesis: true
